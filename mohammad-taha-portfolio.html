<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mohammad Taha Almala — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg-0:#03081c;--bg-1:#061336;--bg-2:#0a2472;
    --panel:rgba(255,255,255,.055);--panel-2:rgba(255,255,255,.035);
    --border:rgba(255,255,255,.13);--border-hi:rgba(120,190,255,.45);
    --text:#e9f1ff;--muted:#8ba2cc;--cyan:#3fd0ff;--blue:#2f6bff;
    --shadow:0 26px 64px -22px rgba(0,0,0,.8);
    --flare-a:rgba(63,208,255,.30);--flare-b:rgba(47,107,255,.40);--flare-c:rgba(120,80,255,.22);
  }
  :root[data-theme="light"]{
    --bg-0:#e9eff9;--bg-1:#dbe6f8;--bg-2:#c6d9f8;
    --panel:rgba(255,255,255,.66);--panel-2:rgba(255,255,255,.48);
    --border:rgba(14,40,92,.12);--border-hi:rgba(20,110,190,.40);
    --text:#08152f;--muted:#4c618b;--cyan:#0a91c4;--blue:#2b52cf;
    --shadow:0 22px 52px -24px rgba(18,45,100,.38);
    --flare-a:rgba(10,145,196,.20);--flare-b:rgba(43,82,207,.20);--flare-c:rgba(120,80,220,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg-0);color:var(--text);font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .5s,color .4s}
  .display{font-family:'Sora','Inter',sans-serif;letter-spacing:-.025em}
  .serif{font-family:'Playfair Display',serif}
  .arabic{font-family:'Tajawal','Sora',sans-serif}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit}

  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:radial-gradient(1200px 760px at 74% -10%,var(--bg-2) 0%,transparent 60%),
      radial-gradient(880px 600px at 4% 16%,var(--bg-1) 0%,transparent 58%),
      linear-gradient(178deg,var(--bg-0) 0%,var(--bg-1) 52%,var(--bg-0) 100%);transition:background .5s}
  .flare{position:absolute;border-radius:9999px;filter:blur(76px)}
  .f1{width:46vw;height:46vw;left:-10vw;top:-8vw;background:var(--flare-a);animation:d1 24s ease-in-out infinite}
  .f2{width:40vw;height:40vw;right:-8vw;top:8vh;background:var(--flare-b);animation:d2 28s ease-in-out infinite}
  .f3{width:32vw;height:32vw;left:34vw;bottom:-14vw;background:var(--flare-c);animation:d1 32s ease-in-out infinite reverse}
  @keyframes d1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4vw,3vh,0) scale(1.1)}}
  @keyframes d2{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-5vw,4vh,0) scale(.95)}}
  .grid-lines{position:absolute;inset:0;opacity:.32;
    background-image:linear-gradient(rgba(130,180,255,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(130,180,255,.11) 1px,transparent 1px);
    background-size:66px 66px;mask-image:radial-gradient(72% 58% at 50% 26%,#000,transparent);
    -webkit-mask-image:radial-gradient(72% 58% at 50% 26%,#000,transparent)}

  .glass{background:var(--panel);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
    border:1px solid var(--border);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.15)}
  .glass-soft{background:var(--panel-2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border)}
  .edge-glow{position:relative}
  .edge-glow::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 38%,transparent 62%,var(--border-hi));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;opacity:.75}
  .text-muted{color:var(--muted)}

  .beam{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--blue),var(--cyan));color:#04122b;font-weight:600;
    box-shadow:0 0 0 1px rgba(255,255,255,.24) inset,0 12px 34px -10px var(--flare-b);
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;border:0;cursor:pointer}
  .beam:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.36) inset,0 20px 48px -12px var(--cyan)}
  .beam::before{content:"";position:absolute;top:0;left:-120%;width:58%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);transition:left .6s}
  .beam:hover::before{left:132%}
  .ghost{transition:border-color .25s,box-shadow .25s,transform .25s;cursor:pointer}
  .ghost:hover{border-color:var(--border-hi);box-shadow:0 0 28px -6px var(--flare-a);transform:translateY(-2px)}
  .tab-on{background:linear-gradient(120deg,rgba(47,107,255,.40),rgba(63,208,255,.24));border-color:var(--border-hi);box-shadow:0 0 30px -10px var(--cyan)}
  input::placeholder{color:var(--muted);opacity:.85}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:12px}

  .rail{display:flex;gap:1.1rem;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:.25rem .25rem 1rem;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .rail>*{scroll-snap-align:center;flex:0 0 auto}
  .card{transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s}
  .card:hover{transform:translateY(-8px);border-color:var(--border-hi);box-shadow:0 34px 72px -30px rgba(0,0,0,.85),0 0 50px -24px var(--cyan)}

  /* device shells */
  .phone{width:280px;height:572px;border-radius:44px;padding:9px;background:linear-gradient(160deg,#31406b,#080e1e);
    box-shadow:0 28px 60px -22px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.16)}
  .phone-screen{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:84px;height:10px;border-radius:99px;background:rgba(0,0,0,.5);z-index:40}
  .win{width:720px;border-radius:16px;overflow:hidden;background:#0a1226;
    box-shadow:0 28px 60px -24px rgba(0,0,0,.85),inset 0 0 0 1px rgba(255,255,255,.12)}
  .win-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#101a36}
  .dot{width:10px;height:10px;border-radius:99px}
  .win-body{height:444px;overflow:hidden;position:relative}
  .scaler{transform-origin:top left}
  .frozen{pointer-events:none;user-select:none}
  .noscroll{overflow-y:auto;scrollbar-width:none}
  .noscroll::-webkit-scrollbar{display:none}

  .tech{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
  .tech:hover{transform:translateY(-6px);border-color:var(--border-hi);box-shadow:0 12px 26px -10px var(--cyan)}
  .stage{opacity:0;transform:translateY(22px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
  .fade{animation:fade .3s ease forwards}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}.stage{opacity:1;transform:none}}
</style>
</head>

function LiveRide({live,start='select'}){
  const [phase,setPhase] = useState(start);

  const [from,setFrom] = useState('Al-Malki, Damascus');
  const [to,setTo] = useState('Airport Road, Terminal 1');
  const [eta,setEta] = useState(132);
  const t = TIERS.find(x=>x.id===tier);

  useEffect(()=>{
    if(!live || (phase!=='arriving' && phase!=='trip')) return;
    const i = setInterval(()=>setEta(e=>e<=1?0:e-1),1000);

const FILMS = [
  {id:1,t:'The Silent Harbour',q:'1080p',mb:2100,c:'#f472b6',kind:'Movies'},
  {id:2,t:'Desert Lines',q:'720p',mb:940,c:'#38bdf8',kind:'Movies'},
  {id:3,t:'Nightfall, Ep. 4',q:'1080p',mb:1400,c:'#34d399',kind:'Series'},
  {id:4,t:'Cedar & Salt',q:'480p',mb:620,c:'#fbbf24',kind:'Movies'},
  {id:5,t:'Nightfall, Ep. 5',q:'1080p',mb:1450,c:'#a78bfa',kind:'Series'},
];
function LiveDownloads({live}){
  const [state,setState] = useState({1:{p:68,run:true},2:{p:100,run:false},3:{p:100,run:false},4:{p:0,run:false},5:{p:0,run:false}});
  const [filter,setFilter] = useState('All');
  useEffect(()=>{
    if(!live) return;
    const i=setInterval(()=>setState(s=>{
      const n={...s}; let changed=false;
      FILMS.forEach(f=>{ const e=n[f.id]; if(e.run && e.p<100){ n[f.id]={p:Math.min(100,e.p+Math.random()*3.4+.8),run:true}; changed=true;
        if(n[f.id].p>=100) n[f.id]={p:100,run:false}; } });
      return changed?n:s;
    }),320);
    return ()=>clearInterval(i);
  },[live]);
  const toggle = id => setState(s=>({...s,[id]:{...s[id],run:s[id].p>=100?false:!s[id].run}}));
  const reset  = id => setState(s=>({...s,[id]:{p:0,run:false}}));
  const used = FILMS.reduce((a,f)=>a+f.mb*(state[f.id].p/100),0)/1024;
  const list = FILMS.filter(f=>filter==='All'||f.kind===filter);
  return (
    <Phone bg="linear-gradient(180deg,#141024,#07040f)">
      <div className="h-full px-4 pt-14 flex flex-col">
        <div className="flex items-end justify-between mb-1">
          <div className="text-[18px] font-semibold text-white">Downloads</div>
          <div className="text-[10px] text-white/40">{used.toFixed(1)} / 12 GB</div>
        </div>
        <Prog p={used/12*100} c="linear-gradient(90deg,#8b5cf6,#f472b6)" h={4}/>
        <div className="flex gap-2 my-3">
          {['All','Movies','Series'].map(t=>(
            <button key={t} onClick={()=>setFilter(t)}
              className={"text-[11px] px-3 py-1 rounded-full transition-colors "+(filter===t?'text-[#120a24]':'text-white/45 border border-white/12')}
              style={filter===t?{background:'#c4b5fd'}:{}}>{t}</button>))}
        </div>
        <div className="flex-1 noscroll space-y-2 pb-3">
          {list.map(f=>{ const e=state[f.id]; const done=e.p>=100; return (
            <div key={f.id} className="rounded-xl p-2.5 flex gap-2.5 border" style={{background:'rgba(255,255,255,.05)',borderColor:done?'rgba(52,211,153,.3)':'rgba(255,255,255,.08)'}}>
              <div className="w-11 h-14 rounded-lg shrink-0" style={{background:f.c,opacity:.45}}/>
              <div className="flex-1 min-w-0">
                <div className="text-[12px] text-white/90 truncate">{f.t}</div>
                <div className="text-[10px] text-white/35 mb-1.5">{f.q} · {(f.mb/1024).toFixed(1)} GB</div>
                {done ? <div className="text-[10px] text-emerald-300 flex items-center gap-1"><Check s={12}/> Saved to device</div>
                  : <React.Fragment>
                      <Prog p={e.p} c={f.c} h={4}/>
                      <div className="flex justify-between mt-1 text-[9px] text-white/40">
                        <span>{e.p.toFixed(0)}%{e.run?' · 4.2 MB/s':' · paused'}</span>
                        <span>{Math.max(0,Math.round((100-e.p)*f.mb/100/4300*1000))} s left</span></div>
                    </React.Fragment>}
              </div>
              <button onClick={()=>done?reset(f.id):toggle(f.id)}
                className="w-8 h-8 rounded-full self-center flex items-center justify-center text-[11px] text-white/75 shrink-0"
                style={{background:'rgba(255,255,255,.1)'}}>
                {done ? '✕' : e.run ? '❚❚' : <DlIcon s={14}/>}
              </button>
            </div>); })}
        </div>
      </div>
    </Phone>
  );
}

  useEffect(()=>()=>Object.values(timers.current).forEach(clearInterval),[]);

function Modal({p,onClose}){
  const [n,setN] = useState(0); // remount key for reset
  useEffect(()=>{
    const k = e => { if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',k);
    const prev = document.body.style.overflow; document.body.style.overflow='hidden';
    return ()=>{ window.removeEventListener('keydown',k); document.body.style.overflow=prev; };
  },[onClose]);
  const C = LIVE[p.id];
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-8 fade" style={{background:'rgba(2,6,18,.72)',backdropFilter:'blur(10px)'}}
      onClick={onClose}>

    </div>
  );
}

/* ===================== contact reveal ===================== */
function ContactReveal({open,onClose}){
  const [copied,setCopied] = useState('');
  const copy = (txt,label) => {
    const done = ()=>{ setCopied(label); setTimeout(()=>setCopied(''),1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(done); }
    else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); done(); }
  };
  if(!open) return null;
  const Row = ({label,value,href,icon}) => (
    <div className="glass-soft rounded-2xl px-4 py-3.5 flex items-center gap-3.5">
      {icon}
      <div className="min-w-0 flex-1">
        <div className="text-[11px] text-muted">{label}</div>
        <a href={href} className="text-[14px] break-all" dir="ltr">{value}</a>
      </div>
      <button onClick={()=>copy(value,label)} className="ghost glass-soft rounded-xl px-3 py-2 text-[11.5px] shrink-0">
        {copied===label?'Copied':'Copy'}</button>
    </div>
  );
  return (
    <div className="glass edge-glow rounded-[24px] p-5 mt-4 pop">
      <div className="flex items-center justify-between mb-3.5">
        <div className="text-[14px] font-medium">Here's how to reach me</div>
        <button onClick={onClose} className="text-muted text-[12px]">Hide</button>
      </div>
      <div className="grid sm:grid-cols-2 gap-2.5">
        <Row label="Email" value="mhamadthaar58@gmail.com" href="mailto:mhamadthaar58@gmail.com"
          icon={<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" strokeWidth="1.8"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="M3 7l9 6 9-6"/></svg>}/>
        <Row label="Phone & WhatsApp" value="+963 938 295 595" href="tel:+963938295595"
          icon={<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" strokeWidth="1.8" strokeLinecap="round"><path d="M6.5 3h3l1.5 4-2 1.5a12 12 0 006.5 6.5l1.5-2 4 1.5v3a2 2 0 01-2.2 2A17.5 17.5 0 014.5 5.2 2 2 0 016.5 3z"/></svg>}/>
      </div>
    </div>
  );
}
